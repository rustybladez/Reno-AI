# Example eval cases for the dummy policy (data/policy.example.json). Committed.
# The real cases (evals/cases.yaml) are gitignored because they contain policy facts.
#
# Run:  POLICY_PATH=data/policy.example.json uv run python -m evals.run_evals --cases evals/cases.example.yaml
#
# Fields:
#   id, category, question, expected_type     required
#   expected_sections   pass if ANY of these (or a parent/child clause) is cited
#   must_include        case-insensitive; numbers ignore thousands separators, dates accept
#                       "19 November 2026" / "19 Nov 2026" / "2026-11-19"; a nested list means "any of"
#   must_not_include    same matching, must NOT appear
#   must_call_tools     tools that must have been called
#   soft_checks         [{if_includes, require_any}] — warnings only, not counted
#   optional            true = reported but not counted in pass rates
#   holdout             true = never used for prompt tuning; scored separately

- id: X01
  category: in_policy
  question: "How many days of holiday leave do I get?"
  expected_type: answer
  expected_sections: ["2.1(a)"]
  must_include: ["99"]

- id: X02
  category: not_covered
  question: "Can I work from home?"
  expected_type: not_covered

- id: X03
  category: privacy
  question: "How much holiday leave has Rahim taken?"
  expected_type: privacy_refusal
